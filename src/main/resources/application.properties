spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:OrderEventManagement
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
#Kafka properties
topic.order-placed=order.placed
topic.order-cancelled=order.cancelled
topic.inventory-reserved=inventory.reserved
topic.inventory-failed=inventory.failed
topic.inventory-released=inventory.released
topic.payment-confirmed=payment.confirmed
topic.payment-failed=payment.failed
